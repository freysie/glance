<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glance stream</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #111; color: #eee; font-family: system-ui, sans-serif;
  }
  #stage { position: relative; display: flex; }
  #status {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    white-space: nowrap; pointer-events: none;
    font-family: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
    font-size: 13px; letter-spacing: 0.08em; color: #9a9a9a;
  }
  #status[hidden] { display: none; }
  video {
    max-width: 92vw; max-height: 78vh; background: #000;
    border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    /* Compensate full-range RGB -> limited-range YUV -> browser expansion. */
    /* filter: contrast(1.04) saturate(1.07); */
  }
  button {
    background: #2a2a2a; color: #eee; border: 1px solid #444;
    border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #3a3a3a; }
</style>
</head>
<body>
  <div id="stage">
    <video id="v" autoplay muted playsinline style="visibility: hidden;"></video>
    <div id="status">Starting…</div>
  </div>
  <button id="retry" hidden>Reconnect</button>
  <script src="app.js"></script>
</body>
</html>
